<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Buatmu | A Little Surprise</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
         OPENING SCREEN
    ========================== -->

    <main class="experience">
      <section class="opening-screen" id="openingScreen">
        <div class="opening-content">
          <p class="small-label">SEBUAH PESAN UNTUKMU</p>

          <h1>
            Ada sesuatu<br />
            <span>buatmu.</span>
          </h1>

          <p class="opening-description">
            Seseorang ingin memberikan sedikit kejutan yang mungkin akan membuat
            harimu lebih berarti.
          </p>

          <button class="open-button" id="openButton">Buka Kejutan</button>
        </div>
      </section>

      <!-- =========================
             SURPRISE CONTENT
        ========================== -->

      <section class="surprise-content" id="surpriseContent">
        <div class="content-wrapper">
          <p class="content-label">UNTUKMU</p>

          <h2 id="recipientName">Aisyah</h2>

          <!-- PHOTO -->

          <div class="photo-container">
            <img id="recipientPhoto" src="assets/photo.jpg" alt="Foto" />
          </div>

          <!-- MESSAGE -->

          <div class="message-card">
            <p class="message" id="messageText"></p>

            <div class="signature">
              <span>Dengan penuh perhatian,</span>

              <strong id="senderName"> Hakram </strong>
            </div>
          </div>

          <!-- CLOSING -->

          <div class="closing">
            <div class="heart">♥</div>

            <p>Semoga hari ini menjadi sedikit lebih indah buatmu.</p>

            <span class="brand"> made with <b>Buatmu</b> </span>
          </div>
        </div>
      </section>
    </main>

    <!-- =========================
         SCRIPT
    ========================== -->

    <script src="script.js"></script>
  </body>
</html>
