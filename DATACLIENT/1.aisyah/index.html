<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Buatmu — Mini</title>

    <style>
      :root {
        --bg: #0d0d10;
        --bg-soft: #15151a;
        --card: #1b1b21;
        --card-soft: #202026;
        --cream: #f7f1e7;
        --white: #ffffff;
        --muted: #aaa6a0;
        --muted-soft: #7e7b77;
        --accent: #d9b98c;
        --accent-soft: rgba(217, 185, 140, 0.16);
        --accent-glow: rgba(217, 185, 140, 0.25);
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(217, 185, 140, 0.08),
            transparent 32%
          ),
          radial-gradient(
            circle at 80% 90%,
            rgba(255, 255, 255, 0.035),
            transparent 30%
          ),
          var(--bg);
        color: var(--cream);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      /* =========================
         AMBIENT BACKGROUND
      ========================= */

      .ambient {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.18;
        animation: drift 12s ease-in-out infinite alternate;
      }

      .orb-1 {
        width: 260px;
        height: 260px;
        background: rgba(217, 185, 140, 0.18);
        top: -80px;
        left: -90px;
      }

      .orb-2 {
        width: 220px;
        height: 220px;
        background: rgba(255, 255, 255, 0.06);
        right: -90px;
        top: 35%;
        animation-delay: -4s;
      }

      .orb-3 {
        width: 280px;
        height: 280px;
        background: rgba(217, 185, 140, 0.1);
        bottom: -130px;
        left: 30%;
        animation-delay: -7s;
      }

      @keyframes drift {
        from {
          transform: translate3d(0, 0, scale(1));
        }

        to {
          transform: translate3d(25px, -20px, scale(1.08));
        }
      }

      /* =========================
         PARTICLES
      ========================= */

      .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }

      .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(247, 241, 231, 0.4);
        animation: floatParticle linear infinite;
      }

      @keyframes floatParticle {
        from {
          transform: translateY(110vh);
          opacity: 0;
        }

        15% {
          opacity: 0.5;
        }

        80% {
          opacity: 0.35;
        }

        to {
          transform: translateY(-10vh);
          opacity: 0;
        }
      }

      /* =========================
         NOISE
      ========================= */

      .noise {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      }

      /* =========================
         APP
      ========================= */

      .app {
        position: relative;
        z-index: 5;
        min-height: 100vh;
      }

      .screen {
        min-height: 100vh;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
        animation: screenIn 0.7s ease;
      }

      .screen.active {
        display: flex;
      }

      @keyframes screenIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      /* =========================
         TYPOGRAPHY
      ========================= */

      .eyebrow {
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      .title {
        font-size: clamp(2.2rem, 9vw, 4rem);
        line-height: 0.98;
        letter-spacing: -0.045em;
        font-weight: 700;
      }

      .title span {
        color: var(--accent);
      }

      .subtitle {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.7;
      }

      /* =========================
         OPENING
      ========================= */

      .opening-card {
        text-align: center;
        padding: 42px 28px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.018)
        );
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .opening-mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 30px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(217, 185, 140, 0.3);
        border-radius: 50%;
        color: var(--accent);
        font-size: 1.35rem;
        background: rgba(217, 185, 140, 0.06);
        box-shadow:
          0 0 40px rgba(217, 185, 140, 0.08),
          inset 0 0 25px rgba(217, 185, 140, 0.04);
        animation: softPulse 3s ease-in-out infinite;
      }

      @keyframes softPulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.05);
        }
      }

      .opening-message {
        margin: 22px auto 30px;
        max-width: 390px;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.75;
        white-space: pre-line;
      }

      /* =========================
         BUTTON
      ========================= */

      .btn {
        border: 0;
        cursor: pointer;
        min-height: 52px;
        padding: 0 26px;
        border-radius: 999px;
        color: #171411;
        background: var(--cream);
        font-size: 0.9rem;
        font-weight: 700;
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease,
          background 0.25s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(247, 241, 231, 0.12);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-secondary {
        color: var(--cream);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
      }

      /* =========================
         BIRTHDAY REVEAL
      ========================= */

      .birthday-card {
        text-align: center;
      }

      .birthday-icon {
        font-size: 2.5rem;
        margin-bottom: 24px;
        animation: birthdayFloat 3s ease-in-out infinite;
      }

      @keyframes birthdayFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }

        50% {
          transform: translateY(-8px) rotate(2deg);
        }
      }

      .birthday-title {
        font-size: clamp(2.5rem, 11vw, 4.8rem);
        line-height: 0.95;
        letter-spacing: -0.055em;
        font-weight: 750;
      }

      .birthday-title span {
        display: block;
        color: var(--accent);
        margin-top: 8px;
      }

      .birthday-date {
        margin-top: 24px;
        color: var(--muted);
        font-size: 0.88rem;
        letter-spacing: 0.08em;
      }

      .birthday-note {
        margin: 28px auto 30px;
        max-width: 390px;
        color: var(--muted);
        line-height: 1.7;
        white-space: pre-line;
      }

      /* =========================
         SECTION HEADER
      ========================= */

      .section-header {
        margin-bottom: 28px;
      }

      .section-title {
        font-size: clamp(1.9rem, 8vw, 3rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .section-description {
        margin-top: 12px;
        color: var(--muted);
        line-height: 1.65;
        font-size: 0.92rem;
      }

      /* =========================
         PHOTO SECTION
      ========================= */

      .photo-section {
        width: 100%;
      }

      .photo-stack {
        display: grid;
        gap: 14px;
      }

      .photo-card {
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--card);
        box-shadow: var(--shadow);
        animation: photoIn 0.6s ease both;
      }

      .photo-card:nth-child(2) {
        animation-delay: 0.08s;
      }

      .photo-card:nth-child(3) {
        animation-delay: 0.16s;
      }

      @keyframes photoIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .photo-card img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .photo-caption {
        padding: 14px 16px 16px;
        color: var(--muted);
        font-size: 0.83rem;
        line-height: 1.55;
      }

      .photo-empty {
        padding: 36px 22px;
        text-align: center;
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        color: var(--muted-soft);
        font-size: 0.85rem;
      }

      /* =========================
         MESSAGE
      ========================= */

      .message-card {
        padding: 30px 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.015)
        );
        box-shadow: var(--shadow);
      }

      .message-label {
        color: var(--accent);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .message-text {
        color: var(--cream);
        font-size: 1rem;
        line-height: 1.9;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }

      .message-from {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.85rem;
      }

      /* =========================
         ENDING
      ========================= */

      .ending-card {
        text-align: center;
        padding: 40px 26px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(217, 185, 140, 0.09),
            transparent 45%
          ),
          rgba(255, 255, 255, 0.025);
        box-shadow: var(--shadow);
      }

      .ending-mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        border-radius: 50%;
        border: 1px solid rgba(217, 185, 140, 0.25);
        color: var(--accent);
        background: rgba(217, 185, 140, 0.06);
      }

      .ending-title {
        font-size: clamp(1.9rem, 8vw, 2.8rem);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .ending-message {
        margin: 20px auto 0;
        max-width: 420px;
        color: var(--muted);
        line-height: 1.8;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }

      .ending-from {
        margin-top: 26px;
        color: var(--cream);
        font-size: 0.9rem;
      }

      .brand {
        margin-top: 34px;
        color: var(--muted-soft);
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      /* =========================
         NAVIGATION DOTS
      ========================= */

      .navigation {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        gap: 7px;
        padding: 8px 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(13, 13, 16, 0.72);
        backdrop-filter: blur(15px);
      }

      .nav-dot {
        width: 6px;
        height: 6px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.2);
        transition:
          width 0.25s ease,
          background 0.25s ease;
      }

      .nav-dot.active {
        width: 18px;
        border-radius: 999px;
        background: var(--accent);
      }

      /* =========================
         RESPONSIVE
      ========================= */

      @media (max-width: 480px) {
        .screen {
          padding-left: 16px;
          padding-right: 16px;
        }

        .opening-card {
          padding: 34px 20px;
        }

        .message-card {
          padding: 26px 20px;
        }

        .ending-card {
          padding: 34px 20px;
        }

        .birthday-title {
          font-size: clamp(2.35rem, 13vw, 4rem);
        }
      }

      @media (min-width: 700px) {
        .photo-stack {
          grid-template-columns: repeat(2, 1fr);
        }

        .photo-card:first-child:last-child {
          grid-column: 1 / -1;
        }

        .photo-card img {
          aspect-ratio: 4 / 3;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
         BACKGROUND
    ========================= -->

    <div class="ambient">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="particles" id="particles"></div>
    <div class="noise"></div>

    <!-- =========================
         APP
    ========================= -->

    <main class="app">
      <!-- =========================
           1. OPENING
      ========================= -->

      <section class="screen active" id="screen-opening">
        <div class="container">
          <div class="opening-card">
            <div class="opening-mark">✦</div>

            <div class="eyebrow">A little surprise</div>

            <h1 class="title">Hey, <span id="openingRecipient">Aisy</span>.</h1>

            <p class="opening-message" id="openingMessage"></p>

            <button class="btn" id="openingButton" onclick="goToScreen(1)">
              Open Your Surprise
            </button>
          </div>
        </div>
      </section>

      <!-- =========================
           2. BIRTHDAY REVEAL
      ========================= -->

      <section class="screen" id="screen-birthday">
        <div class="container">
          <div class="birthday-card">
            <div class="birthday-icon">🎂</div>

            <div class="eyebrow">Today is your day</div>

            <h2 class="birthday-title">
              Happy Birthday,
              <span id="birthdayRecipient">Aisyah</span>
            </h2>

            <p class="birthday-date" id="birthdayDate">27 September 2026</p>

            <p class="birthday-note" id="birthdayMessage"></p>

            <button class="btn" onclick="goToScreen(2)">Continue</button>
          </div>
        </div>
      </section>

      <!-- =========================
           3. PHOTO
      ========================= -->

      <section class="screen" id="screen-photo">
        <div class="container">
          <div class="section-header">
            <div class="eyebrow">A few moments</div>

            <h2 class="section-title">Little memories.</h2>

            <p class="section-description">
              Three little snapshots, kept in one place.
            </p>
          </div>

          <div class="photo-section">
            <div class="photo-stack" id="photoStack"></div>
          </div>

          <div style="margin-top: 28px; text-align: center">
            <button class="btn" onclick="goToScreen(3)">
              Read the message
            </button>
          </div>
        </div>
      </section>

      <!-- =========================
           4. MESSAGE
      ========================= -->

      <section class="screen" id="screen-message">
        <div class="container">
          <div class="section-header">
            <div class="eyebrow">A message for you</div>

            <h2 class="section-title">From someone who cares.</h2>
          </div>

          <div class="message-card">
            <div class="message-label">Personal Message</div>

            <div class="message-text" id="messageText"></div>

            <div class="message-from" id="messageFrom"></div>
          </div>

          <div style="margin-top: 28px; text-align: center">
            <button class="btn" onclick="goToScreen(4)">One last thing</button>
          </div>
        </div>
      </section>

      <!-- =========================
           5. ENDING
      ========================= -->

      <section class="screen" id="screen-ending">
        <div class="container">
          <div class="ending-card">
            <div class="ending-mark">✦</div>

            <div class="eyebrow">That's all</div>

            <h2 class="ending-title" id="endingTitle">
              One Last Little Thing.
            </h2>

            <p class="ending-message" id="endingMessage"></p>

            <div class="ending-from" id="endingFrom"></div>

            <div class="brand">Made with Buatmu</div>
          </div>
        </div>
      </section>
    </main>

    <!-- =========================
         NAVIGATION
    ========================= -->

    <nav class="navigation" aria-label="Page navigation">
      <button
        class="nav-dot active"
        onclick="goToScreen(0)"
        aria-label="Opening"
      ></button>

      <button
        class="nav-dot"
        onclick="goToScreen(1)"
        aria-label="Birthday"
      ></button>

      <button
        class="nav-dot"
        onclick="goToScreen(2)"
        aria-label="Photos"
      ></button>

      <button
        class="nav-dot"
        onclick="goToScreen(3)"
        aria-label="Message"
      ></button>

      <button
        class="nav-dot"
        onclick="goToScreen(4)"
        aria-label="Ending"
      ></button>
    </nav>

    <script>
      /* =====================================================
         MINI MASTER
         BUATMU

         FLOW:
         OPENING
         ↓
         BIRTHDAY REVEAL
         ↓
         PHOTO
         ↓
         MESSAGE
         ↓
         ENDING

         MAX PHOTO: 3
      ===================================================== */

      /* =========================
         CLIENT DATA
      ========================= */

      const clientData = {
        // =========================
        // IDENTITY
        // =========================

        recipient: "Aisyah",
        nickname: "Aisy",
        sender: "Hakram",
        birthdayDate: "27 September 2026",

        // =========================
        // OPENING
        // =========================

        openingMessage: `Hey Aisy, someone made a little surprise for you.
It may be simple, but it's made just for you. ✨`,

        openingButton: "Open Your Surprise",

        // =========================
        // BIRTHDAY MESSAGE
        // =========================

        birthdayMessage: `Happy Birthday, Aisyah! 🎂
Semoga hari ini dipenuhi banyak senyum, hal-hal kecil yang menyenangkan, dan orang-orang yang membuat kamu merasa berharga.`,

        // =========================
        // PERSONAL MESSAGE
        // =========================

        message: `Selamat ulang tahun, Aisyah.

Semoga di umur yang baru ini, kamu selalu dikelilingi hal-hal baik dan orang-orang yang tulus. Semoga semua yang sedang kamu perjuangkan perlahan menemukan jalannya, dan semoga kamu tetap punya alasan untuk tersenyum bahkan di hari-hari yang terasa biasa saja.

Terima kasih sudah menjadi seseorang yang begitu berarti. Mungkin kejutan ini sederhana, tapi semoga bisa menjadi sedikit bagian dari hari spesialmu.

Nikmati hari ini, jangan terlalu banyak mikir, dan jangan lupa bahagia. Kamu pantas mendapatkan banyak hal baik.

Happy birthday, Aisyah. 🎂✨`,

        // =========================
        // PHOTOS
        // MAX 3
        // =========================

        photos: [
          {
            image: "assets/photos/photo-1.jpg",
            caption: "A little smile worth remembering.",
          },

          {
            image: "assets/photos/photo-2.jpg",
            caption: "One of those moments we'll remember.",
          },

          {
            image: "assets/photos/photo-3.jpg",
            caption: "Just a little moment, just for you.",
          },
        ],

        // =========================
        // ENDING
        // =========================

        ending: {
          title: "One Last Little Thing.",

          message: `Semoga kejutan kecil ini bisa membuat harimu sedikit lebih spesial.

Keep smiling, keep being you, and have a beautiful birthday. ✨`,

          from: "— Hakram.",
        },
      };

      /* =========================
         HELPERS
      ========================= */

      function safeText(value, fallback = "") {
        if (value === null || value === undefined) {
          return fallback;
        }

        return String(value).trim();
      }

      /* =========================
         PARTICLES
      ========================= */

      function createParticles() {
        const container = document.getElementById("particles");

        if (!container) return;

        const totalParticles = 24;

        for (let i = 0; i < totalParticles; i++) {
          const particle = document.createElement("span");

          particle.className = "particle";

          particle.style.left = `${Math.random() * 100}%`;

          particle.style.animationDuration = `${8 + Math.random() * 10}s`;

          particle.style.animationDelay = `${Math.random() * -15}s`;

          particle.style.opacity = `${0.15 + Math.random() * 0.35}`;

          container.appendChild(particle);
        }
      }

      /* =========================
         RENDER IDENTITY
      ========================= */

      function renderIdentity() {
        const recipient = safeText(clientData.recipient, "Someone");

        const nickname = safeText(clientData.nickname, recipient);

        const date = safeText(clientData.birthdayDate);

        document.getElementById("openingRecipient").textContent = nickname;

        document.getElementById("birthdayRecipient").textContent = recipient;

        document.getElementById("birthdayDate").textContent = date;
      }

      /* =========================
         RENDER OPENING
      ========================= */

      function renderOpening() {
        const message = safeText(
          clientData.openingMessage,
          "Someone made a little surprise just for you.",
        );

        const button = safeText(clientData.openingButton, "Open");

        document.getElementById("openingMessage").textContent = message;

        document.getElementById("openingButton").textContent = button;
      }

      /* =========================
         RENDER BIRTHDAY MESSAGE
      ========================= */

      function renderBirthdayMessage() {
        const message = safeText(clientData.birthdayMessage, "Happy Birthday!");

        document.getElementById("birthdayMessage").textContent = message;
      }

      /* =========================
         RENDER PHOTOS
         MAX 3
      ========================= */

      function renderPhotos() {
        const container = document.getElementById("photoStack");

        if (!container) return;

        container.innerHTML = "";

        const photos = Array.isArray(clientData.photos)
          ? clientData.photos
              .filter((photo) => photo && safeText(photo.image))
              .slice(0, 3)
          : [];

        if (photos.length === 0) {
          container.innerHTML = `
            <div class="photo-empty">
              No photos added yet.
            </div>
          `;

          return;
        }

        photos.forEach((photo) => {
          const card = document.createElement("article");

          card.className = "photo-card";

          const image = document.createElement("img");

          image.src = safeText(photo.image);

          image.alt = safeText(photo.caption, "Memory");

          image.onerror = function () {
            this.style.display = "none";

            const fallback = document.createElement("div");

            fallback.className = "photo-empty";

            fallback.textContent = "Photo unavailable.";

            card.prepend(fallback);
          };

          card.appendChild(image);

          const caption = safeText(photo.caption);

          if (caption) {
            const captionElement = document.createElement("div");

            captionElement.className = "photo-caption";

            captionElement.textContent = caption;

            card.appendChild(captionElement);
          }

          container.appendChild(card);
        });
      }

      /* =========================
         RENDER MESSAGE
      ========================= */

      function renderMessage() {
        const message = safeText(clientData.message, "Happy Birthday!");

        const sender = safeText(clientData.sender);

        document.getElementById("messageText").textContent = message;

        document.getElementById("messageFrom").textContent = sender
          ? `— ${sender}`
          : "";
      }

      /* =========================
         RENDER ENDING
      ========================= */

      function renderEnding() {
        const ending = clientData.ending || {};

        document.getElementById("endingTitle").textContent = safeText(
          ending.title,
          "Keep this little moment.",
        );

        document.getElementById("endingMessage").textContent = safeText(
          ending.message,
        );

        document.getElementById("endingFrom").textContent = safeText(
          ending.from,
        );
      }

      /* =========================
         SCREEN NAVIGATION
      ========================= */

      let currentScreen = 0;

      function goToScreen(index) {
        const screens = document.querySelectorAll(".screen");

        const dots = document.querySelectorAll(".nav-dot");

        if (index < 0 || index >= screens.length) {
          return;
        }

        screens.forEach((screen, screenIndex) => {
          screen.classList.toggle("active", screenIndex === index);
        });

        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === index);
        });

        currentScreen = index;

        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }

      /* =========================
         KEYBOARD NAVIGATION
         OPTIONAL
      ========================= */

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight") {
          if (currentScreen < document.querySelectorAll(".screen").length - 1) {
            goToScreen(currentScreen + 1);
          }
        }

        if (event.key === "ArrowLeft") {
          if (currentScreen > 0) {
            goToScreen(currentScreen - 1);
          }
        }
      });

      /* =========================
         INITIALIZE
      ========================= */

      createParticles();
      renderIdentity();
      renderOpening();
      renderBirthdayMessage();
      renderPhotos();
      renderMessage();
      renderEnding();
    </script>
  </body>
</html>
